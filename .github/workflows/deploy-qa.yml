name: Deploy - QA Environment

on:
  push:
    branches:
      - qa

jobs:
  deploy-qa:
    name: Build & Deploy to QA Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy (placeholder)
        run: echo "Add your QA deployment command here"